name: Publish

# Shared Publish workflow, called by each plugin repository's own
# .github/workflows/publish.yml. It runs in the caller's repository, so every
# github.* value and the token below belong to the plugin, not to this one.
#
# It publishes only a merged release pull request: the caller runs it when a
# pull request closes, and the first step stops unless that pull request was
# merged from a release/{version} branch whose {version} is the project-version
# it merged. Any other event stops there too, except workflow_dispatch on the
# default branch, which retries a release after a failure.
#
# The version is project-version in the caller's gradle.properties. The next
# step looks for the v{version} tag on the remote: when it exists the run stops
# there, so an ordinary merge that leaves the version alone publishes nothing.
# When it does not exist the run tests, publishes, and only then creates the
# tag, so a failed publish never leaves a tag behind and the next run tries
# again. Version 0.0.0 means "never released yet" and is skipped the same way.
#
# A repository whose modules are not published to GitHub Packages passes
# publish-packages: false; the run still tests and tags the release, which is
# what the Release workflow builds its GitHub release from.
#
# The caller grants the permissions: contents: write to push the tag and
# packages: write to publish. GITHUB_ACTOR and GITHUB_TOKEN are set for every
# step, because a plugin that depends on another plugin's library resolves it
# from GitHub Packages during the build, not only during the publish.
on:
  workflow_call:
    inputs:
      java-version:
        description: JDK version used to build the plugin.
        required: false
        type: string
        default: '25'
      publish-packages:
        description: Run the Gradle publish task. False only tests and tags.
        required: false
        type: boolean
        default: true
      build-task:
        description: Gradle task that builds and tests the release.
        required: false
        type: string
        default: build
      publish-task:
        description: Gradle task that publishes the library modules.
        required: false
        type: string
        default: publish
    outputs:
      tag:
        description: The v{version} tag this run looked for.
        value: ${{ jobs.release.outputs.tag }}
      published:
        description: True when this run published and created the tag.
        value: ${{ jobs.release.outputs.publish }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Check that a release branch merged
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          MERGED: ${{ github.event.pull_request.merged }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          case "$EVENT" in
            pull_request)
              if [ "$MERGED" != "true" ]; then
                echo "::notice::the pull request closed without merging, nothing to publish"
                echo "run=false" >> "$GITHUB_OUTPUT"
              elif ! [[ "$HEAD_REF" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                echo "::notice::$HEAD_REF is not a release/{version} branch, nothing to publish"
                echo "run=false" >> "$GITHUB_OUTPUT"
              else
                echo "run=true" >> "$GITHUB_OUTPUT"
                echo "branch-version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
                echo "sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
              fi
              ;;
            workflow_dispatch)
              if [ "$GITHUB_REF" != "$DEFAULT_REF" ]; then
                echo "::error::run Publish by hand from the default branch, not $GITHUB_REF"
                exit 1
              fi
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::notice::Publish runs for a merged release/{version} pull request, not for $EVENT"
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Check out
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.sha }}

      - name: Read the version and look for its tag
        id: release
        if: steps.gate.outputs.run == 'true'
        env:
          BRANCH_VERSION: ${{ steps.gate.outputs.branch-version }}
        run: |
          version=$(sed -n 's/^project-version=//p' gradle.properties | tr -d '[:space:]')
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::project-version '$version' in gradle.properties is not Major.Minor.Patch"
            exit 1
          fi
          if [ -n "$BRANCH_VERSION" ] && [ "$BRANCH_VERSION" != "$version" ]; then
            echo "::error::release/$BRANCH_VERSION merged project-version $version"
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$version" = "0.0.0" ]; then
            echo "::notice::project-version is 0.0.0, nothing has been released yet"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "::notice::$tag already exists, nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK ${{ inputs.java-version }}
        if: steps.release.outputs.publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: gradle

      - name: Build and test
        if: steps.release.outputs.publish == 'true'
        env:
          BUILD_TASK: ${{ inputs.build-task }}
        run: ./gradlew "$BUILD_TASK"

      - name: Publish to GitHub Packages
        if: steps.release.outputs.publish == 'true' && inputs.publish-packages
        env:
          PUBLISH_TASK: ${{ inputs.publish-task }}
        run: ./gradlew "$PUBLISH_TASK"

      - name: Tag the release
        if: steps.release.outputs.publish == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ steps.gate.outputs.sha }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"
