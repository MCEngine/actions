name: Release

# Shared Release workflow, called by each plugin repository's own
# .github/workflows/release.yml. It runs in the caller's repository, so every
# github.* value and the token below belong to the plugin, not to this one.
#
# It builds the plugin's distributed jars, by default the one universal jar from
# platforms/engine, and attaches them to a GitHub release for the v{version} tag
# that Publish created. The library modules are bundled inside that jar, so
# they are not attached on their own.
#
# A tag pushed with the workflow's own token starts no other workflow, so the
# caller runs this when a Publish run on master finishes instead. It releases
# the version in gradle.properties when that version's tag exists and has no
# release yet, so an ordinary merge, whose tag already has its release, does
# nothing, and a release that failed is tried again by the next merge.
#
# The jars are built from the tagged commit, not from the commit that started
# the run, so a release holds the version its tag names. They travel from the
# build job to the release job as a workflow artifact, which is deleted once the
# release holds them.
#
# The notes are wiki/logs/{Major}/{Minor}/{Patch}/CHANGELOG.md from the tag,
# with relative links pointed at the tagged files; without one the merged pull
# requests are listed instead.
#
# The caller grants the permissions: contents: write to create the release,
# actions: write to delete the artifact, and packages: read so a plugin that
# depends on another plugin's library can resolve it from GitHub Packages.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to release, such as v1.2.0. Empty for the version in gradle.properties.
        required: false
        type: string
        default: ''
      jars:
        description: >-
          Newline-separated globs of the jars to attach, relative to the
          repository root. {version} is replaced by the tag's version, and each
          glob must match exactly one jar that is not a sources or javadoc jar.
        required: false
        type: string
        default: platforms/engine/build/libs/*-{version}.jar
      java-version:
        description: JDK version used to build the plugin.
        required: false
        type: string
        default: '25'
      assemble-task:
        description: Gradle task that builds the jars. Publish already ran the tests.
        required: false
        type: string
        default: assemble
    outputs:
      tag:
        description: The tag this run looked at.
        value: ${{ jobs.build.outputs.tag }}
      released:
        description: True when this run created the release.
        value: ${{ jobs.build.outputs.release }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      tag: ${{ steps.release.outputs.tag }}
      latest: ${{ steps.release.outputs.latest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Find the tag and look for its release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n 's/^project-version=//p' gradle.properties | tr -d '[:space:]')
          tag="${INPUT_TAG:-v$version}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a v{Major}.{Minor}.{Patch} tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Only the version on master is marked as the latest release.
          if [ "$tag" = "v$version" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "::notice::$tag does not exist, nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --silent 2>/dev/null; then
            echo "::notice::$tag already has a release, nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the tag
        if: steps.release.outputs.release == 'true'
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - name: Set up JDK ${{ inputs.java-version }}
        if: steps.release.outputs.release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: gradle

      - name: Build the jars
        if: steps.release.outputs.release == 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          ASSEMBLE_TASK: ${{ inputs.assemble-task }}
        run: ./gradlew "$ASSEMBLE_TASK"

      - name: Collect the jars
        if: steps.release.outputs.release == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          JARS: ${{ inputs.jars }}
        run: |
          version=$(sed -n 's/^project-version=//p' gradle.properties | tr -d '[:space:]')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::$TAG holds project-version $version"
            exit 1
          fi
          mkdir -p release
          shopt -s nullglob
          while IFS= read -r pattern; do
            pattern="${pattern#"${pattern%%[![:space:]]*}"}"
            pattern="${pattern%"${pattern##*[![:space:]]}"}"
            [ -n "$pattern" ] || continue
            pattern="${pattern//\{version\}/$version}"
            jars=()
            for jar in $pattern; do
              [[ "$jar" == *-sources.jar || "$jar" == *-javadoc.jar ]] || jars+=("$jar")
            done
            if [ ${#jars[@]} -ne 1 ]; then
              echo "::error::expected one jar for $pattern, found: ${jars[*]}"
              exit 1
            fi
            cp "${jars[0]}" release/
          done <<< "$JARS"
          if [ -z "$(ls release)" ]; then
            echo "::error::the jars input named no jar"
            exit 1
          fi
          ls -l release

      - name: Upload the jars to the run
        id: upload
        if: steps.release.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jars
          path: release/*.jar
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Check out the changelog
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.build.outputs.tag }}
          sparse-checkout: wiki/logs

      - name: Download the jars
        uses: actions/download-artifact@v4
        with:
          name: plugin-jars
          path: release

      # The notes are the version's changelog. Its links are relative to
      # wiki/logs/{Major}/{Minor}/{Patch}/, so they are pointed at the tagged files.
      - name: Write the release notes
        run: |
          IFS=. read -r major minor patch <<< "${TAG#v}"
          changelog="wiki/logs/$major/$minor/$patch/CHANGELOG.md"
          if [ -f "$changelog" ]; then
            python3 - "$changelog" "https://github.com/$GITHUB_REPOSITORY/blob/$TAG/" > notes.md <<'PY'
          import posixpath, re, sys
          path, base = sys.argv[1], sys.argv[2]
          folder = posixpath.dirname(path)
          def absolute(match):
              target = match.group(2)
              if re.match(r'[a-z]+:|#|/', target):
                  return match.group(0)
              return match.group(1) + base + posixpath.normpath(posixpath.join(folder, target)) + ')'
          with open(path, encoding='utf-8') as file:
              sys.stdout.write(re.sub(r'(\]\()([^)\s]+)\)', absolute, file.read()))
          PY
          else
            echo "::warning::$changelog does not exist, the notes list the merged pull requests instead"
            : > notes.md
          fi

      - name: Create the release
        env:
          LATEST: ${{ needs.build.outputs.latest }}
        run: |
          if [ -s notes.md ]; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$TAG" release/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --latest="$LATEST" \
            "${notes[@]}"

      - name: Delete the jars from the run
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
